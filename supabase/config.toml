# 「芯」(Incipel)本地开发用 Supabase 配置。
# 仅本地开发生效;远端项目的等价设置在 Dashboard 配置(见 README)。
# project_id 用作本地容器命名前缀,不与任何远端项目挂钩。
#
# 端口刻意用 5452x 段(而非 Supabase 默认 5432x):本机可能同时跑别的本地
# Supabase 栈(默认占 5432x、5442x),本项目独占 5452x,互不抢端口。
# 改这里的端口后,务必同步 packages/agent/.env(SUPABASE_URL)与
# apps/mobile/.env(EXPO_PUBLIC_SUPABASE_URL),见 README。
project_id = "incipel"

[api]
enabled = true
# REST/GraphQL/Realtime 的本地端口(Kong 网关)。
port = 54521
# 通过 PostgREST 暴露的 schema。
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# 单次集合请求的最大返回行数。
max_rows = 1000

[db]
# 本地 Postgres 端口。
port = 54522
# `db diff` 用的影子库端口。
shadow_port = 54520
# 与生产对齐的大版本号。
major_version = 15

[db.pooler]
enabled = false
port = 54529
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54523
api_url = "http://127.0.0.1:54521"

# 本地抓取发出的邮件(确认/找回等),不真正投递。
[inbucket]
enabled = true
port = 54524

[storage]
enabled = true
# 单文件上传上限(图片上传用)。
file_size_limit = "50MiB"

[auth]
enabled = true
# 本地签发链接里的站点根地址。
site_url = "http://127.0.0.1:3000"
# 登录后允许重定向到的地址白名单。
additional_redirect_urls = ["http://127.0.0.1:3000"]
# JWT 有效期(秒)。
jwt_expiry = 3600
# 允许用 refresh token 续期。
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# 允许新用户注册。
enable_signup = true
# 关键:开启匿名登录 —— 零摩擦入门,事后可选升级账号(见系统设计 §15/§16)。
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# 本地开发免去邮箱确认,加快联调。
enable_confirmations = false

# Apple 登录(iOS 原生 Sign in with Apple → signInWithIdToken,见 ADR-0004)。
# client_id 必须等于 app 的 bundle id:GoTrue 据此校验 Apple identity token 的 aud,
# 不匹配会报「Bad ID token」。原生 id-token 流只校验 token、不走 OAuth code 交换,
# 故本地不需要真正的 secret —— 这里给个非空占位,仅为让 supabase start 通过校验;
# 真正的 web/OAuth secret 是远端 Dashboard 的事(用 Service ID + .p8 key 签发)。
[auth.external.apple]
enabled = true
client_id = "com.incipel.app"
secret = "local-native-id-token-flow-needs-no-secret"

# Google 暂不接(v1 仅 Apple + 匿名,见 ADR-0004)。
[auth.external.google]
enabled = false

[edge_runtime]
enabled = true
# 本地 Edge Function 的运行策略:oneshot 便于热重载调试。
policy = "oneshot"
# 留在 5452x 段内,避免与默认 8083 或其他本地服务冲突。
inspector_port = 54525

[analytics]
enabled = false
