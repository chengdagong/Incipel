# 「织幕」(Incipel)本地开发用 Supabase 配置。
# 仅本地开发生效;远端项目的等价设置在 Dashboard 配置(见 README)。
# project_id 用作本地容器命名前缀,不与任何远端项目挂钩。
#
# 端口刻意用 5452x 段(而非 Supabase 默认 5432x):本机可能同时跑别的本地
# Supabase 栈(默认占 5432x、5442x),本项目独占 5452x,互不抢端口。
# 改这里的端口后,运行 pnpm env:sync,同步 supabase/.env(SUPABASE_URL/AGENT_PORT)
# 与 apps/mobile/.env(EXPO_PUBLIC_SUPABASE_URL/EXPO_PUBLIC_AGENT_URL),见 README。
project_id = "incipel"

[api]
enabled = true
# REST/GraphQL/Realtime 的本地端口(Kong 网关)。
port = 54521
# 通过 PostgREST 暴露的 schema。
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# 单次集合请求的最大返回行数。
max_rows = 1000

[db]
# 本地 Postgres 端口。
port = 54522
# `db diff` 用的影子库端口。
shadow_port = 54520
# 与生产一致的大版本号。
major_version = 15

[db.pooler]
enabled = false
port = 54529
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54523
api_url = "http://127.0.0.1:54521"

# 本地抓取发出的邮件(确认/找回等),不真正投递。
[inbucket]
enabled = true
port = 54524

[storage]
enabled = true
# 单文件上传上限(图片上传用)。
file_size_limit = "50MiB"

[auth]
enabled = true
# 本地签发链接里的站点根地址。
site_url = "http://127.0.0.1:3000"
# 登录后允许重定向到的地址白名单。
additional_redirect_urls = ["http://127.0.0.1:3000"]
# JWT 有效期(秒)。
jwt_expiry = 3600
# 允许用 refresh token 续期。
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# 允许新用户注册。
enable_signup = true
# 关键:开启匿名登录 —— 零摩擦入门,事后可选升级账号(见系统设计 §15/§16)。
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# 本地开发免去邮箱确认,加快联调。
enable_confirmations = false

# Apple 登录(iOS 原生 Sign in with Apple → signInWithIdToken,见 ADR-0005)。
# client_id 必须等于 app 的 bundle id:GoTrue 据此校验 Apple identity token 的 aud,
# 不匹配会报「Bad ID token」。原生 id-token 流只校验 token、不走 OAuth code 交换,
# 故本地不需要真正的 secret —— 这里给个非空占位,仅为让 supabase start 通过校验;
# 真正的 web/OAuth secret 是远端 Dashboard 的事(用 Service ID + .p8 key 签发)。
[auth.external.apple]
enabled = true
client_id = "com.incipel.app"
secret = "local-native-id-token-flow-needs-no-secret"

# Google 登录:原生 Google Sign-In → signInWithIdToken / native linkIdentity。
# 本地开发需把 client_id 换成真实 Web client id;secret 本地可用非空占位,
# 远端 Supabase Dashboard 需填写真实 Google client secret。
# @react-native-google-signin/google-signin 的 Original API 不提供 nonce 参数,
# 故本地 Google native ID token 路径需要跳过 nonce 校验。Apple 仍保留 nonce 校验。
[auth.external.google]
enabled = true
client_id = "585832312756-n6gabhbjgjmigge641pq4e9trr2tabs6.apps.googleusercontent.com,585832312756-btcd7d9c7ihj4djnfv04hftecb6jhjrj.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
# 历史 Edge Function 配置;当前 agent runtime 是 Mastra Node server。
policy = "oneshot"
# 留在 5452x 段内,避免与默认 8083 或其他本地服务冲突。
inspector_port = 54525

# 历史 agent Edge Function 配置;当前运行时见 ADR-0011。
[functions.agent]
enabled = true
# 网关层不校验 JWT:鉴权由函数内的 authenticate() 负责(更严,校验 iss/aud/sub),
# 与「agent 是唯一鉴权处」一致(见 packages/agent/src/auth.ts、system-design §4);
# 如此 /agent/health 也能不带 token 探活。依赖映射自动取同目录 deno.json。
verify_jwt = false

[analytics]
enabled = false
