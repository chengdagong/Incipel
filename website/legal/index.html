<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法律条款 · 织幕</title>
<meta name="description" content="织幕的服务条款与隐私政策。">
<style>
  :root{ --bg:#F4F1EA; --text:#2A2825; --body:#54504A; --muted:#645F58; --border:#E2DDD4; --accent:#A8552E; }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--body);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.75; min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:64px 20px}
  .brand{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
    font-size:34px; font-weight:700; color:var(--text); margin:0 0 4px;
  }
  .tag{color:var(--muted); font-size:15px; margin:0 0 36px}
  .cards{display:grid; gap:14px}
  a.card{
    display:block; padding:20px 22px; border:1px solid var(--border); border-radius:14px;
    background:#FBFAF7; text-decoration:none; color:var(--text);
  }
  a.card:hover{border-color:var(--accent)}
  a.card .t{font-size:18px; font-weight:600}
  a.card .d{color:var(--muted); font-size:14px; margin-top:4px}
  footer{color:var(--muted); font-size:13px; margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="brand">织幕</h1>
  <p class="tag">从灵感到剧本 · 一个 AI 原生的编剧助手</p>
  <div class="cards">
    <a class="card" href="./terms/">
      <div class="t">服务条款</div>
      <div class="d">你使用织幕所适用的条款与条件</div>
    </a>
    <a class="card" href="./privacy/">
      <div class="t">隐私政策</div>
      <div class="d">我们如何收集、使用与保护你的信息</div>
    </a>
  </div>
  <footer>© 织幕团队</footer>
</div>
</body>
</html>
