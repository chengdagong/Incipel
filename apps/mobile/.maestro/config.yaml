# Maestro workspace 配置。
#
# flows/    可独立运行的流程,本集合按 glob 收集。
# subflows/ 被 runFlow 复用的片段,不在集合内、不会被独立选中。
#
# 流程按后端依赖分三层,用 tag 过滤(详见 README.md):
#   frontend-only   仅 app(DEV_NO_AUTH bundle),不起 agent
#   stub-agent      app(DEV_NO_AUTH)+ agent(MODEL_PROVIDER=stub STORE=memory DEV_NO_AUTH=1)
#   real-ai         app(DEV_NO_AUTH)+ agent(MODEL_PROVIDER=openrouter STORE=memory DEV_NO_AUTH=1)
#   supabase        app(真实匿名登录)+ agent(MODEL_PROVIDER=stub + 真 SupabaseStore)
#
# 日常套件(免 Supabase):
#   maestro test --include-tags frontend-only,stub-agent apps/mobile/.maestro/
# 一般经 scripts/e2e-ios.sh 跑,它会按层接好端口 / 模拟器 / agent。
flows:
  - "flows/*.yaml"
