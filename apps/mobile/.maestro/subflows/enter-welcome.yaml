# 复用片段(frontend-only / stub-agent 层):清态启动,DEV_NO_AUTH bundle 跳过登录门直达欢迎页。
# 前置:app 以 EXPO_PUBLIC_DEV_NO_AUTH=1 打包(scripts/e2e-ios.sh 的 frontend-only,stub-agent 层会接好)。
appId: com.incipel.app
---
- launchApp:
    clearState: true
# 等 JS bundle 加载完、欢迎页出现(「开始创作」按钮恒在)
- extendedWaitUntil:
    visible: ".*开始创作.*"
    timeout: 60000
