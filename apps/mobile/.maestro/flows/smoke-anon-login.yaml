# [supabase] 冒烟:登录页 →「先随便逛逛」匿名登录 → 欢迎页渲染。
# 验证会话门控与登录后主界面(与 Apple 登录共用同一套 signInAnonymously→Supabase 会话→门控)。
#
# 点击目标按 testID(login-anon / welcome-start),与文案 / 语言脱开。
#
# 前置:本地 Supabase 栈已起、apps/mobile/.env 填好真实 anon key、未设 EXPO_PUBLIC_DEV_NO_AUTH。
appId: com.incipel.app
tags:
  - supabase
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "login-anon"
    timeout: 60000
- tapOn:
    id: "login-anon"
- extendedWaitUntil:
    visible:
      id: "welcome-start"
    timeout: 30000
