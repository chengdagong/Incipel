# [frontend-only] 欢迎页纯 UI:控件在位 + 题材 chip 可单选 + 输入灵感后可开始。
# 刻意不点骰子(/logline)、不进对话屏(/run)——这两者要后端,留给 stub-agent 层。
appId: com.incipel.app
tags:
  - frontend-only
---
- runFlow: ../subflows/enter-welcome.yaml
# 关键控件在位:题材标题(内容)用文案断言;控件本身按 testID
- assertVisible: "想写哪种类型？"
- assertVisible:
    id: "welcome-idea"
- assertVisible:
    id: "welcome-genre-0"
- assertVisible:
    id: "welcome-start"
# 题材 chip 单选:连点两个不报错(选择态只改样式、无可断言文本)
- tapOn:
    id: "welcome-genre-0"
- tapOn:
    id: "welcome-genre-1"
# 灵感输入框可输入:打字后内容回显;这串不是任何题材 chip 的标签,只可能在输入框里
- tapOn:
    id: "welcome-idea"
- inputText: "一个荒诞的设定"
- assertVisible: ".*一个荒诞的设定.*"
