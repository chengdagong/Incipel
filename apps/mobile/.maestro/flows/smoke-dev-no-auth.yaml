# [frontend-only] DEV_NO_AUTH 门控:打包带 EXPO_PUBLIC_DEV_NO_AUTH=1 时,启动跳过登录页直达欢迎页。
# 不起 agent;纯验证门控与欢迎页首屏渲染。
appId: com.incipel.app
tags:
  - frontend-only
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*开始创作.*"
    timeout: 60000
# 登录入口不应出现——门已被 DEV_NO_AUTH 放行
- assertNotVisible: "先随便逛逛"
