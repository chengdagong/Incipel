# [frontend-only] 多语言切换(纯客户端,AsyncStorage):设置里从简体中文切到 English,断言界面文案变英文。
# 不依赖任何后端;同时验证「切语言只改界面、不报错」。
appId: com.incipel.app
tags:
  - frontend-only
---
- runFlow: ../subflows/enter-welcome.yaml
# 进设置:菜单唤出抽屉 → 抽屉头像(设置入口)
- tapOn:
    id: "menu-button"
- tapOn:
    id: "drawer-settings"
- extendedWaitUntil:
    visible:
      id: "settings-lang-row"
    timeout: 20000
# 展开语言下拉,选 English(语言项 testID 按 code:settings-lang-en)
- tapOn:
    id: "settings-lang-row"
- tapOn:
    id: "settings-lang-en"
# 界面文案应整体变英文:语言行标题变为「Interface language」(内容断言,证明切换生效)
- assertVisible: ".*Interface language.*"
