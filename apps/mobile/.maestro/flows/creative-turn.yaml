# [stub-agent] 核心价值路径:灵感 → 开始创作 → stub 一轮的流式回复 → 内联人物卡(含「打开人物卡片」页脚)→ 引导选项。
# 需 stub agent(MODEL_PROVIDER=stub STORE=memory DEV_NO_AUTH=1)在线。这一轮内容写死在 src/model/stub.ts。
appId: com.incipel.app
tags:
  - stub-agent
---
- runFlow: ../subflows/enter-welcome.yaml
# 新欢迎屏:在灵感输入框打字开启「开始创作」(题材 chip 只单选、不再回填灵感)
- tapOn:
    id: "welcome-idea"
- inputText: "一个测试灵感"
- runFlow: ../subflows/finish-keyboard-input.yaml
# 助手流式回复(助手名「主管编剧」=内容断言)
- extendedWaitUntil:
    visible: "主管编剧"
    timeout: 40000
# 内联人物卡:stub 写死的人物「林夏」与其定位
- extendedWaitUntil:
    visible: "林夏"
    timeout: 40000
- assertVisible: "钟点工"
# 人物卡页脚:打开人物卡片入口(UI 重构后,卡片不再有「已存入草稿 / 打开文档全文」文案)
- assertVisible: ".*打开人物卡片.*"
# 引导选项(propose_options 的第一项)
- assertVisible: ".*先挖她的过去.*"
