# 冒烟测试:登录页 →「先随便逛逛」匿名登录 → 创作页渲染。
# 验证会话门控与登录后主界面在当前 SDK 下正常(与 Apple 登录共用同一套 signInAnonymously→Supabase 会话→门控)。
#
# 前置:Metro 已起(apps/mobile 下 `npx expo start --port 8081`)、目标 iOS 模拟器 booted、app 已装(dev build)。
# 跑法:maestro test apps/mobile/.maestro/anon-login.yaml
appId: com.incipel.app
---
# 清掉本地状态 → 必定回到登录页(无会话)
- launchApp:
    clearState: true
# 等 JS bundle 加载、登录页出现
- extendedWaitUntil:
    visible: "先随便逛逛"
    timeout: 60000
# 真实点击匿名登录入口
- tapOn: "先随便逛逛"
# 匿名登录成功 → 会话门控放行 → 创作页出现
- extendedWaitUntil:
    visible: "给我一个灵感"
    timeout: 30000
