# CI(见 docs/testing-strategy.md §6)。
# 阶段 1/2:typecheck + Vitest,每个 PR 跑;Vitest 含 real AI integration,需注入 OPENROUTER_API_KEY。
# 阶段 3:pgTAP,需本地 Supabase 栈(Docker),独立 job。
# 阶段 4:smoke / verify-summary 可另建 schedule/workflow_dispatch 的补充 job。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: bash scripts/dev-ios-target.test.sh
      - run: node --test tools/incipel-dev/cli.test.mjs
      - run: pnpm -r test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  db-pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 启动本地栈(应用 supabase/migrations)后跑 supabase/tests 下的 pgTAP。
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop
